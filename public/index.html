<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>リラくん｜リライズテニスクラブ</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><main><header><span class="brand">RERISE TENNIS CLUB</span><h1>リラくんに、聞いてみよう。</h1><p>リライズテニスクラブの、のんびりAI案内係。</p></header><section class="layout"><aside><div class="portrait"><img src="rira.png" alt="りらいずのシャツを着て、ラケットを持つリラくん"></div><h2>こんにちは、リラくんです 🎾</h2><p>練習のこと、クラブのこと。<br>気になることを話しかけてね。</p><button id="motion" class="quiet">動きを止める</button><div class="note">最新の日程・出欠は「調整さん」、<br>当日の連絡はLINEをご確認ください。</div></aside><section class="chat" aria-label="リラくんとの会話"><div class="chathead"><strong>リラくんとおしゃべり</strong><button id="reset" class="quiet">新しい会話</button></div><div id="messages" role="log" aria-live="polite" aria-relevant="additions text"></div><div class="suggestions"><button>練習はどこで、いつ？</button><button>どんなクラブ？</button><button>入会できますか？</button></div><form id="form"><label for="query">リラくんへの質問</label><div class="inputrow"><textarea id="query" maxlength="2000" rows="2" placeholder="ここに質問を入力してください" required></textarea><button id="send" type="submit">送信 ↗</button></div><p id="status" role="status"></p></form></section></section><footer>AIの回答には誤りが含まれる場合があります。個人情報は入力しないでください。<br>この画面から予約・出欠登録はできません。</footer></main></body></html>
